name: Build DaliStructure

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Configure (downloads JUCE automatically)
        run: cmake -B build -A x64 -DDALI_BUILD_PLUGIN=ON

      - name: Build plugin, tests and CLI
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $out = "DaliStructure-Windows"

          New-Item -ItemType Directory -Force $out | Out-Null

          Write-Host "Searching for VST3..."

          $vst3 = Get-ChildItem `
            -Path build `
            -Recurse `
            -Directory `
            -Filter "DaliStructure.vst3" |
            Where-Object { $_.FullName -like "*Release*" } |
            Select-Object -First 1

          if (-not $vst3) {
            throw "VST3 bundle not found"
          }

          Write-Host "Found VST3: $($vst3.FullName)"

          Copy-Item `
            -Recurse `
            $vst3.FullName `
            "$out/"

          Write-Host "Searching for Standalone..."

          $exe = Get-ChildItem `
            -Path build `
            -Recurse `
            -File `
            -Filter "DaliStructure.exe" |
            Where-Object { $_.FullName -like "*Standalone*" } |
            Select-Object -First 1

          if ($exe) {
            Write-Host "Found Standalone: $($exe.FullName)"
            Copy-Item $exe.FullName "$out/"
          }
          else {
            Write-Host "Standalone executable not found - continuing"
          }

          Write-Host "Searching for CLI..."

          $cli = Get-ChildItem `
            -Path build `
            -Recurse `
            -File `
            -Filter "dali_analyze.exe" |
            Select-Object -First 1

          if ($cli) {
            Write-Host "Found CLI: $($cli.FullName)"
            Copy-Item $cli.FullName "$out/"
          }
          else {
            Write-Host "CLI executable not found - continuing"
          }

          if (-not (Test-Path "INSTALL-Windows.txt")) {
            throw "INSTALL-Windows.txt not found"
          }

          Copy-Item "INSTALL-Windows.txt" "$out/"

          Write-Host ""
          Write-Host "===== PACKAGE CONTENTS ====="

          Get-ChildItem -Recurse $out |
            Select-Object FullName

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: DaliStructure-Windows
          path: DaliStructure-Windows

      - name: Run engine tests (143 checks)
        run: |
          ctest `
            --test-dir build `
            -C Release `
            --output-on-failure

      - name: Check DLL dependencies (must not need the Visual C++ Redistributable)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Finding Visual Studio installation..."

          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -property installationPath

          if (-not $vs) {
            throw "Visual Studio installation was not found"
          }

          Write-Host "Visual Studio: $vs"

          $dumpbin = Get-ChildItem `
            "$vs\VC\Tools\MSVC" `
            -Recurse `
            -Filter dumpbin.exe |
            Where-Object { $_.FullName -like "*Hostx64\x64*" } |
            Select-Object -First 1

          if (-not $dumpbin) {
            throw "dumpbin.exe was not found"
          }

          Write-Host "dumpbin: $($dumpbin.FullName)"

          $dll = Get-ChildItem `
            DaliStructure-Windows `
            -Recurse `
            -File `
            -Filter "DaliStructure.vst3" |
            Select-Object -First 1

          if (-not $dll) {
            throw "DaliStructure.vst3 was not found in package"
          }

          Write-Host "Checking dependencies for:"
          Write-Host $dll.FullName

          $deps = & $dumpbin.FullName /dependents $dll.FullName |
            Out-String

          Write-Host ""
          Write-Host "===== DLL DEPENDENCIES ====="
          Write-Host $deps

          if ($deps -match "VCRUNTIME|MSVCP") {
            throw "Plugin still depends on the Visual C++ runtime DLLs"
          }

          Write-Host ""
          Write-Host "DLL dependency check passed."

      - name: Validate plugin with pluginval
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== DOWNLOADING PLUGINVAL ====="

          Invoke-WebRequest `
            -Uri "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" `
            -OutFile pluginval.zip

          if (-not (Test-Path "pluginval.zip")) {
            throw "pluginval.zip was not downloaded"
          }

          Write-Host "Extracting pluginval..."

          Expand-Archive `
            pluginval.zip `
            -DestinationPath pluginval `
            -Force

          $exe = Get-ChildItem `
            pluginval `
            -Recurse `
            -File `
            -Filter "pluginval.exe" |
            Select-Object -First 1

          if (-not $exe) {
            throw "pluginval.exe was not found after extraction"
          }

          Write-Host "pluginval executable:"
          Write-Host $exe.FullName

          Write-Host ""
          Write-Host "===== LOCATING VST3 ====="

          $vst3 = Get-ChildItem `
            DaliStructure-Windows `
            -Recurse `
            -Directory `
            -Filter "*.vst3" |
            Select-Object -First 1

          if (-not $vst3) {
            throw "No VST3 plugin found in DaliStructure-Windows"
          }

          Write-Host "VST3 plugin:"
          Write-Host $vst3.FullName

          Write-Host ""
          Write-Host "===== RUNNING PLUGINVAL ====="

          $arguments = @(
            "--strictness-level", "5",
            "--skip-gui-tests",
            "--timeout-ms", "300000",
            "--verbose",
            "--validate",
            $vst3.FullName
          )

          Write-Host "Command:"
          Write-Host "$($exe.FullName) $($arguments -join ' ')"

          & $exe.FullName @arguments

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "===== PLUGINVAL RESULT ====="
          Write-Host "pluginval exit code: $exitCode"

          if ($exitCode -ne 0) {
            throw "pluginval failed with exit code $exitCode"
          }

          Write-Host ""
          Write-Host "PLUGINVAL PASSED."
