name: Build DaliStructure

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64 -DDALI_BUILD_PLUGIN=ON

      - name: Build plugin, tests and CLI
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $out = "DaliStructure-Windows"
          New-Item -ItemType Directory -Force $out | Out-Null

          Write-Host "===== SEARCHING FOR VST3 ====="

          $vst3 = Get-ChildItem `
            -Path build `
            -Recurse `
            -Directory `
            -Filter "DaliStructure.vst3" |
            Where-Object { $_.FullName -like "*Release*" } |
            Select-Object -First 1

          if (-not $vst3) {
            throw "VST3 bundle not found"
          }

          Write-Host "Found:"
          Write-Host $vst3.FullName

          Copy-Item `
            -Recurse `
            $vst3.FullName `
            "$out/"

          $exe = Get-ChildItem `
            -Path build `
            -Recurse `
            -File `
            -Filter "DaliStructure.exe" |
            Where-Object { $_.FullName -like "*Standalone*" } |
            Select-Object -First 1

          if ($exe) {
            Write-Host "Found Standalone:"
            Write-Host $exe.FullName
            Copy-Item $exe.FullName "$out/"
          }

          $cli = Get-ChildItem `
            -Path build `
            -Recurse `
            -File `
            -Filter "dali_analyze.exe" |
            Select-Object -First 1

          if ($cli) {
            Write-Host "Found CLI:"
            Write-Host $cli.FullName
            Copy-Item $cli.FullName "$out/"
          }

          if (-not (Test-Path "INSTALL-Windows.txt")) {
            throw "INSTALL-Windows.txt not found"
          }

          Copy-Item "INSTALL-Windows.txt" "$out/"

          Write-Host ""
          Write-Host "===== PACKAGE CONTENTS ====="

          Get-ChildItem -Recurse $out |
            Select-Object FullName

      - name: Run engine tests
        run: |
          ctest `
            --test-dir build `
            -C Release `
            --output-on-failure

      - name: Check DLL dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== CHECKING DLL DEPENDENCIES ====="

          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -property installationPath

          if (-not $vs) {
            throw "Visual Studio installation was not found"
          }

          $dumpbin = Get-ChildItem `
            "$vs\VC\Tools\MSVC" `
            -Recurse `
            -Filter dumpbin.exe |
            Where-Object { $_.FullName -like "*Hostx64\x64*" } |
            Select-Object -First 1

          if (-not $dumpbin) {
            throw "dumpbin.exe was not found"
          }

          $dll = Get-ChildItem `
            DaliStructure-Windows `
            -Recurse `
            -File `
            -Filter "DaliStructure.vst3" |
            Select-Object -First 1

          if (-not $dll) {
            throw "DaliStructure.vst3 was not found"
          }

          $deps = & $dumpbin.FullName /dependents $dll.FullName |
            Out-String

          Write-Host $deps

          if ($deps -match "VCRUNTIME|MSVCP") {
            throw "Plugin still depends on the Visual C++ runtime DLLs"
          }

          Write-Host "DLL dependency check PASSED."

      - name: Validate plugin with pluginval
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                 PLUGINVAL VALIDATION"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "Downloading pluginval..."

          Invoke-WebRequest `
            -Uri "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" `
            -OutFile pluginval.zip

          Expand-Archive `
            pluginval.zip `
            -DestinationPath pluginval `
            -Force

          $pluginvalExe = Get-ChildItem `
            pluginval `
            -Recurse `
            -File `
            -Filter "pluginval.exe" |
            Select-Object -First 1

          if (-not $pluginvalExe) {
            throw "pluginval.exe was not found"
          }

          $vst3 = Get-ChildItem `
            DaliStructure-Windows `
            -Recurse `
            -Directory `
            -Filter "*.vst3" |
            Select-Object -First 1

          if (-not $vst3) {
            throw "No VST3 plugin found"
          }

          Write-Host ""
          Write-Host "pluginval:"
          Write-Host $pluginvalExe.FullName

          Write-Host ""
          Write-Host "Plugin:"
          Write-Host $vst3.FullName

          $logFile = Join-Path $PWD "pluginval-output.txt"

          $arguments = @(
            "--strictness-level", "5",
            "--skip-gui-tests",
            "--timeout-ms", "300000",
            "--verbose",
            "--validate",
            $vst3.FullName
          )

          Write-Host ""
          Write-Host "Command:"
          Write-Host "$($pluginvalExe.FullName) $($arguments -join ' ')"

          Write-Host ""
          Write-Host "===== STARTING PLUGINVAL ====="
          Write-Host ""

          & $pluginvalExe.FullName @arguments 2>&1 |
            Tee-Object -FilePath $logFile

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "===== PLUGINVAL PROCESS EXIT CODE ====="
          Write-Host $exitCode

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                 PLUGINVAL TEST SUMMARY"
          Write-Host "============================================================"

          $log = Get-Content $logFile -Raw

          $testStarts = [regex]::Matches(
            $log,
            'Starting tests in: pluginval / (.+)'
          )

          $completed = [regex]::Matches(
            $log,
            'Completed tests in pluginval / (.+)'
          )

          Write-Host ""
          Write-Host "Tests detected: $($testStarts.Count)"
          Write-Host "Tests completed: $($completed.Count)"

          Write-Host ""
          Write-Host "Completed tests:"

          foreach ($match in $completed) {
            Write-Host "  [PASS] $($match.Groups[1].Value)"
          }

          Write-Host ""
          Write-Host "Looking for failures..."

          $failurePatterns = @(
            "FAIL",
            "FAILED",
            "Error:",
            "ERROR:",
            "Exception:",
            "assert",
            "crash",
            "timeout",
            "timed out"
          )

          $failureLines = @()

          foreach ($line in (Get-Content $logFile)) {
            foreach ($pattern in $failurePatterns) {
              if ($line -match $pattern) {
                $failureLines += $line
                break
              }
            }
          }

          if ($failureLines.Count -gt 0) {
            Write-Host ""
            Write-Host "===== POSSIBLE FAILURE DETAILS ====="

            foreach ($line in $failureLines) {
              Write-Host "  $line"
            }
          }

          Write-Host ""
          Write-Host "============================================================"

          if ($exitCode -ne 0) {
            Write-Host ""
            Write-Host "PLUGINVAL FAILED."
            Write-Host ""
            Write-Host "The build will intentionally fail."
            Write-Host "Nothing is being ignored or bypassed."
            Write-Host ""
            Write-Host "Full pluginval output was saved to:"
            Write-Host $logFile

            throw "pluginval failed with exit code $exitCode"
          }

          Write-Host ""
          Write-Host "PLUGINVAL PASSED."
          Write-Host "All validation requirements passed."

      - name: Upload pluginval diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DaliStructure-pluginval-diagnostics
          path: pluginval-output.txt
          if-no-files-found: ignore

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DaliStructure-Windows
          path: DaliStructure-Windows
